<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelPass — Cek Keamanan Kredensial</title>
    <meta
      name="description"
      content="Periksa apakah password Anda pernah bocor dalam peretasan publik secara aman menggunakan metode k-Anonymity."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #030712;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
      }
      .mono-font {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-sky-500 selection:text-slate-950">
    
    <!-- Background Glow Accent -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-sky-500/10 blur-[140px] pointer-events-none rounded-full"></div>

    <div id="root" class="relative z-10 my-auto"></div>

    <script type="text/babel" data-presets="env,react">
      const formatNumber = new Intl.NumberFormat("id-ID");

      function copyText(value) {
        if (!value) return Promise.reject(new Error("empty"));
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(value);
        }
        return new Promise(function (resolve, reject) {
          try {
            var textarea = document.createElement("textarea");
            textarea.value = value;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            var successful = document.execCommand("copy");
            document.body.removeChild(textarea);
            if (successful) resolve();
            else reject(new Error("copy_failed"));
          } catch (error) {
            reject(error);
          }
        });
      }

      function App() {
        const [password, setPassword] = React.useState("");
        const [visible, setVisible] = React.useState(false);
        const [loading, setLoading] = React.useState(false);
        const [response, setResponse] = React.useState(null);
        const [error, setError] = React.useState("");
        const [copiedPassword, setCopiedPassword] = React.useState(false);
        const [showTechnicalDetails, setShowTechnicalDetails] = React.useState(false);
        const [status, setStatus] = React.useState({
          state: "checking",
          label: "Menghubungkan...",
          latency: null,
        });

        const probeServer = React.useCallback(async function () {
          var start = performance.now();
          try {
            await fetch("/api/generate-password", {
              method: "GET",
              cache: "no-store",
            });
            var elapsed = Math.round(performance.now() - start);
            setStatus({
              state: "online",
              label: "Sistem Siap",
              latency: elapsed,
            });
          } catch (probeError) {
            setStatus({
              state: "offline",
              label: "Sistem Offline",
              latency: null,
            });
          }
        }, []);

        React.useEffect(function () {
          probeServer();
          var timer = window.setInterval(probeServer, 30000);
          return function () {
            window.clearInterval(timer);
          };
        }, [probeServer]);

        async function handleCheck(event) {
          event.preventDefault();
          var trimmed = password.trim();
          if (!trimmed) {
            setError("Silakan masukkan password terlebih dahulu.");
            return;
          }

          setLoading(true);
          setError("");

          try {
            var started = performance.now();
            var res = await fetch("/api/check-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password: trimmed }),
            });

            var payload = await res.json();
            if (!res.ok) {
              throw new Error(payload.error || "Gagal memeriksa password.");
            }

            setResponse(payload);
            setStatus(function (current) {
              return {
                state: current.state,
                label: current.label,
                latency: Math.max(1, Math.round(performance.now() - started)),
              };
            });
          } catch (checkError) {
            var message = checkError && checkError.message ? checkError.message : "Tidak dapat terhubung ke server.";
            setError(message);
          } finally {
            setLoading(false);
          }
        }

        async function handleGenerate() {
          setError("");
          try {
            var res = await fetch("/api/generate-password", {
              method: "GET",
              cache: "no-store",
            });
            var payload = await res.json();
            if (!res.ok) throw new Error(payload.error || "Gagal membuat password.");

            setPassword(payload.generated_password);
            setVisible(true);

            try {
              await copyText(payload.generated_password);
              setCopiedPassword(true);
            } catch (clipboardError) {}

            window.setTimeout(function () {
              setCopiedPassword(false);
            }, 2000);
          } catch (generateError) {
            setError("Gagal membuat password acak.");
          }
        }

        async function handleCopyHash() {
          if (!response || !response.full_hash) return;
          try {
            await copyText(response.full_hash);
          } catch (copyError) {}
        }

        return (
          <div className="w-full max-w-full md:max-w-3xl lg:max-w-5xl mx-auto px-4 py-8 sm:py-12 flex flex-col gap-8">
            
            <header className="flex items-center justify-between border-b border-slate-800/80 pb-5">
              <div className="flex items-center gap-3">
                <div className="h-9 w-9 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold text-sm shadow-inner">
                  🛡️
                </div>
                <div>
                  <h1 className="font-semibold text-slate-100 text-base tracking-tight leading-none">
                    SentinelPass
                  </h1>
                  <span className="text-[11px] text-slate-400">
                    K-Anonymity Breach Engine
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-full shadow-sm">
                <span className={"h-2 w-2 rounded-full " + (status.state === "offline" ? "bg-rose-500 shadow-sm shadow-rose-500" : status.state === "online" ? "bg-emerald-400 shadow-sm shadow-emerald-400" : "bg-amber-400")}></span>
                <span className="text-slate-300 font-medium">{status.label}</span>
              </div>
            </header>

            <section className="space-y-3 text-center">
              <h2 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight">
                Deteksi Kebocoran Password Anda
              </h2>
              <p className="mx-auto max-w-2xl text-xs sm:text-sm text-slate-400 leading-relaxed">
                Periksa apakah kredensial Anda pernah muncul dalam pangkalan data peretasan publik tanpa mempertaruhkan kerahasiaan password.
              </p>
            </section>

            <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 sm:p-8 md:p-10 backdrop-blur-xl shadow-2xl space-y-6">
              
              <form onSubmit={handleCheck} className="flex flex-col gap-5">
                <div className="flex flex-col gap-2">
                  <div className="flex justify-between items-center text-xs sm:text-sm">
                    <label className="font-medium text-slate-300">Masukkan Password</label>
                    <button
                      type="button"
                      onClick={handleGenerate}
                      className="text-sky-400 hover:text-sky-300 font-medium transition flex items-center gap-1.5"
                    >
                      {copiedPassword ? "✓ Tersalin!" : "🎲 Buat Password Kuat"}
                    </button>
                  </div>

                  <div className="relative">
                    <input
                      autoComplete="off"
                      spellCheck="false"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="ketik disini"
                      type={visible ? "text" : "password"}
                      className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3.5 text-sm sm:text-base text-slate-100 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition placeholder:text-slate-600 mono-font"
                    />
                    <button
                      type="button"
                      onClick={() => setVisible(!visible)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 hover:text-slate-200 px-2.5 py-1.5 bg-slate-800/50 hover:bg-slate-800 rounded-lg transition"
                    >
                      {visible ? "Sembunyikan" : "Tampilkan"}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-sky-500 hover:bg-sky-400 active:scale-[0.99] text-slate-950 font-semibold text-sm sm:text-base py-3.5 rounded-xl transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-sky-500/20"
                >
                  {loading ? (
                    <>
                      <svg className="animate-spin h-5 w-5 text-slate-950" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      <span>Memeriksa Database Kebocoran...</span>
                    </>
                  ) : (
                    "Uji Keamanan Password"
                  )}
                </button>

                <div className="flex items-center justify-center gap-2 text-xs text-slate-400 bg-slate-950/40 border border-slate-800/50 px-4 py-2.5 rounded-xl">
                  <span>🔒</span>
                  <span><strong>Privasi Terjamin:</strong> Password asli Anda tidak pernah dikirimkan ke internet (Menggunakan metode k-Anonymity).</span>
                </div>

                {error && (
                  <div className="bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs sm:text-sm p-4 rounded-xl">
                    {error}
                  </div>
                )}
              </form>

              {response && (
                <div className={"border rounded-xl p-6 transition-all space-y-5 text-center " + (response.is_pwned ? "bg-rose-500/10 border-rose-500/30 text-rose-200" : "bg-emerald-500/10 border-emerald-500/30 text-emerald-200")}>
                  <div className={"mx-auto flex h-14 w-14 items-center justify-center rounded-2xl text-3xl " + (response.is_pwned ? "bg-rose-500/20 text-rose-400" : "bg-emerald-500/20 text-emerald-400")}>
                    {response.is_pwned ? "🚨" : "🛡️"}
                  </div>

                  <div>
                    <h3 className={"font-bold text-xl " + (response.is_pwned ? "text-rose-400" : "text-emerald-400")}>
                      {response.is_pwned ? "Password Pernah Bocor!" : "Password Belum Ditemukan Bocor"}
                    </h3>
                    <p className="mt-2 text-xs sm:text-sm text-slate-300 leading-relaxed max-w-xl mx-auto">
                      {response.is_pwned
                        ? `Password ini terdeteksi muncul sebanyak ${formatNumber.format(response.pwned_count)} kali pada kebocoran data publik. Segera ganti jika Anda menggunakannya!`
                        : "Password ini tidak ditemukan di database data breach yang terdaftar saat ini."}
                    </p>
                  </div>

                  <div className="grid gap-4 sm:grid-cols-2 text-left pt-2">
                    <div className="rounded-xl border border-slate-800 bg-slate-950/80 p-4">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Jumlah Kebocoran</div>
                      <div className="mono-font mt-1 text-2xl font-bold text-white">
                        {response.is_pwned ? formatNumber.format(response.pwned_count) : "0"}
                      </div>
                    </div>
                    <div className="rounded-xl border border-slate-800 bg-slate-950/80 p-4">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">SHA-1 Prefix Sent</div>
                      <div className="mono-font mt-1 text-base font-semibold text-sky-400">
                        {response.prefix || "N/A"}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {response && (
                <div className="pt-2 text-center border-t border-slate-800/80">
                  <button
                    type="button"
                    onClick={() => setShowTechnicalDetails(!showTechnicalDetails)}
                    className="text-xs text-slate-400 hover:text-slate-200 transition underline underline-offset-4"
                  >
                    {showTechnicalDetails ? "Sembunyikan Detail Hash" : "Tampilkan Detail SHA-1 Hash"}
                  </button>

                  {showTechnicalDetails && (
                    <div className="mt-3 rounded-xl border border-slate-800 bg-slate-950/90 p-4 text-left text-xs text-slate-400 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-slate-400 font-medium">Full SHA-1 Hash:</span>
                        <button type="button" onClick={handleCopyHash} className="text-sky-400 hover:text-sky-300 text-[11px]">
                          Salin Hash
                        </button>
                      </div>
                      <p className="mono-font break-all rounded-lg border border-slate-800 bg-slate-900/90 p-2.5 text-slate-200 text-xs">
                        {response.full_hash}
                      </p>
                    </div>
                  )}
                </div>
              )}
            </div>

            <footer className="text-center text-xs text-slate-500 space-y-1">
              <p>SentinelPass &copy; 2026 — Built with Go & React</p>
              <p className="text-[11px] text-slate-600">Powered by Have I Been Pwned API</p>
            </footer>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>

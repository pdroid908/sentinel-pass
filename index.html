<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelPass — Cek Keamanan Password</title>
    <meta
      name="description"
      content="Periksa apakah password Anda pernah bocor dalam peretasan publik secara aman."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: #090d16;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
      }

      .mono-font {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between"
  >
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
      const formatNumber = new Intl.NumberFormat("id-ID");

      function copyText(value) {
        if (!value) return Promise.reject(new Error("empty"));

        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(value);
        }

        return new Promise(function (resolve, reject) {
          try {
            var textarea = document.createElement("textarea");
            textarea.value = value;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            var successful = document.execCommand("copy");
            document.body.removeChild(textarea);
            if (successful) {
              resolve();
            } else {
              reject(new Error("copy_failed"));
            }
          } catch (error) {
            reject(error);
          }
        });
      }

      function App() {
        const [password, setPassword] = React.useState("");
        const [visible, setVisible] = React.useState(false);
        const [loading, setLoading] = React.useState(false);
        const [response, setResponse] = React.useState(null);
        const [error, setError] = React.useState("");
        const [copiedPassword, setCopiedPassword] = React.useState(false);
        const [showTechnicalDetails, setShowTechnicalDetails] =
          React.useState(false);
        const [status, setStatus] = React.useState({
          state: "checking",
          label: "Menghubungkan...",
          latency: null,
        });

        const probeServer = React.useCallback(async function () {
          var start = performance.now();

          try {
            await fetch("/api/generate-password", {
              method: "GET",
              cache: "no-store",
            });

            var elapsed = Math.round(performance.now() - start);
            setStatus({
              state: "online",
              label: "Sistem Siap",
              latency: elapsed,
            });
          } catch (probeError) {
            setStatus({
              state: "offline",
              label: "Sistem Offline",
              latency: null,
            });
          }
        }, []);

        React.useEffect(
          function () {
            probeServer();
            var timer = window.setInterval(probeServer, 30000);
            return function () {
              window.clearInterval(timer);
            };
          },
          [probeServer],
        );

        async function handleCheck(event) {
          event.preventDefault();

          var trimmed = password.trim();
          if (!trimmed) {
            setError("Silakan masukkan password terlebih dahulu.");
            return;
          }

          setLoading(true);
          setError("");

          try {
            var started = performance.now();
            var res = await fetch("/api/check-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password: trimmed }),
            });

            var payload = await res.json();

            if (!res.ok) {
              throw new Error(payload.error || "Gagal memeriksa password.");
            }

            setResponse(payload);
            setStatus(function (current) {
              return {
                state: current.state,
                label: current.label,
                latency: Math.max(1, Math.round(performance.now() - started)),
              };
            });
          } catch (checkError) {
            var message =
              checkError && checkError.message
                ? checkError.message
                : "Tidak dapat terhubung ke server. Coba beberapa saat lagi.";
            setError(message);
          } finally {
            setLoading(false);
          }
        }

        async function handleGenerate() {
          setError("");

          try {
            var res = await fetch("/api/generate-password", {
              method: "GET",
              cache: "no-store",
            });
            var payload = await res.json();

            if (!res.ok) {
              throw new Error(payload.error || "Gagal membuat password.");
            }

            setPassword(payload.generated_password);
            setVisible(true);

            try {
              await copyText(payload.generated_password);
              setCopiedPassword(true);
            } catch (clipboardError) {}

            window.setTimeout(function () {
              setCopiedPassword(false);
            }, 2000);
          } catch (generateError) {
            var message =
              generateError && generateError.message
                ? generateError.message
                : "Gagal membuat password acak.";
            setError(message);
          }
        }

        async function handleCopyHash() {
          if (!response || !response.full_hash) return;
          try {
            await copyText(response.full_hash);
          } catch (copyError) {}
        }

        return (
          <div className="w-full max-w-lg mx-auto px-4 py-6 sm:py-10 flex flex-col gap-6">
            {/* Top Bar / Header */}
            <header className="flex items-center justify-between border-b border-slate-800/80 pb-4">
              <div className="flex items-center gap-2.5">
                <div className="h-8 w-8 rounded-lg bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 font-bold text-base">
                  SP
                </div>
                <div>
                  <h1 className="font-semibold text-slate-100 text-sm tracking-tight leading-none">
                    SentinelPass
                  </h1>
                  <span className="text-[11px] text-slate-400">
                    Cek keamanan password
                  </span>
                </div>
              </div>

              {/* Status Indicator */}
              <div className="flex items-center gap-2 text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                <span
                  className={
                    "h-2 w-2 rounded-full " +
                    (status.state === "offline"
                      ? "bg-rose-500"
                      : status.state === "online"
                        ? "bg-emerald-500"
                        : "bg-amber-500")
                  }
                ></span>
                <span className="text-slate-300 font-medium">
                  {status.label}
                </span>
              </div>
            </header>

            {/* Title Section */}
            <section className="space-y-2 text-center">
              <h2 className="text-xl sm:text-2xl font-bold text-white tracking-tight">
                Cek kebocoran password dengan tampilan yang lebih ringan
              </h2>
              <p className="mx-auto max-w-xl text-xs sm:text-sm text-slate-400 leading-relaxed">
                Masukkan password, tekan cek, lalu lihat hasilnya di bawah. Jika
                perlu password baru, gunakan tombol generate kecil di kanan
                atas.
              </p>
            </section>

            {/* Main Form */}
            <form onSubmit={handleCheck} className="flex flex-col gap-3.5">
              <div className="flex flex-col gap-1.5">
                <div className="flex justify-between items-center text-xs">
                  <label className="font-medium text-slate-300">Password</label>
                  <button
                    type="button"
                    onClick={handleGenerate}
                    className="text-sky-400 hover:text-sky-300 font-medium transition flex items-center gap-1"
                  >
                    {copiedPassword
                      ? "✓ Password Dibuat & Disalin"
                      : "🎲 Buat Password Acak"}
                  </button>
                </div>

                <div className="relative">
                  <input
                    autoComplete="off"
                    spellCheck="false"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Masukkan password yang ingin dicek..."
                    type={visible ? "text" : "password"}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition placeholder:text-slate-600"
                  />
                  <button
                    type="button"
                    onClick={() => setVisible(!visible)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 hover:text-slate-200 px-2 py-1"
                  >
                    {visible ? "Sembunyikan" : "Tampilkan"}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm py-3 rounded-xl transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-sm shadow-sky-500/10"
              >
                {loading ? (
                  <>
                    <svg
                      className="animate-spin h-4 w-4 text-slate-950"
                      fill="none"
                      viewBox="0 0 24 24"
                    >
                      <circle
                        className="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        strokeWidth="4"
                      ></circle>
                      <path
                        className="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                      ></path>
                    </svg>
                    <span>Memeriksa Keamanan...</span>
                  </>
                ) : (
                  "Cek Keamanan Password"
                )}
              </button>

              {error && (
                <div className="bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs p-3 rounded-xl">
                  {error}
                </div>
              )}
            </form>

            {/* Result Area */}
            <div
              className={
                "border rounded-2xl p-4 sm:p-5 transition-all " +
                (response
                  ? response.is_pwned
                    ? "bg-rose-500/5 border-rose-500/20"
                    : "bg-emerald-500/5 border-emerald-500/20"
                  : "bg-slate-900/40 border-slate-800/80")
              }
            >
              {response ? (
                <div className="space-y-4 text-center">
                  <div
                    className={
                      "mx-auto flex h-12 w-12 items-center justify-center rounded-2xl text-2xl " +
                      (response.is_pwned
                        ? "bg-rose-500/10 text-rose-400"
                        : "bg-emerald-500/10 text-emerald-400")
                    }
                  >
                    {response.is_pwned ? "⚠️" : "✅"}
                  </div>

                  <div>
                    <h3
                      className={
                        "font-semibold text-base sm:text-lg " +
                        (response.is_pwned
                          ? "text-rose-400"
                          : "text-emerald-400")
                      }
                    >
                      {response.is_pwned ? "Password bocor" : "Password aman"}
                    </h3>
                    <p className="mt-2 text-sm text-slate-300 leading-relaxed max-w-xl mx-auto">
                      {response.is_pwned
                        ? `Password ini muncul sebanyak ${formatNumber.format(response.pwned_count)} kali di kebocoran publik.`
                        : "Password ini tidak ditemukan di kebocoran publik yang dicek saat ini."}
                    </p>
                  </div>

                  <div className="grid gap-3 sm:grid-cols-2 text-left">
                    <div className="rounded-xl border border-slate-800/80 bg-slate-950/70 p-4">
                      <div className="text-[11px] uppercase tracking-[0.22em] text-slate-500">
                        Breach count
                      </div>
                      <div className="mono-font mt-2 text-2xl font-bold text-white">
                        {response.is_pwned
                          ? formatNumber.format(response.pwned_count)
                          : "0"}
                      </div>
                    </div>
                    <div className="rounded-xl border border-slate-800/80 bg-slate-950/70 p-4">
                      <div className="text-[11px] uppercase tracking-[0.22em] text-slate-500">
                        Matched suffix
                      </div>
                      <div className="mono-font mt-2 break-all text-sm font-semibold text-slate-100">
                        {response.matched_suffix || "None"}
                      </div>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={handleCopyHash}
                    className="inline-flex items-center justify-center rounded-xl border border-slate-700/80 bg-slate-900/90 px-4 py-2 text-xs font-semibold text-slate-200 transition hover:border-cyan-400/50 hover:text-white"
                  >
                    Salin hash teknis
                  </button>

                  {showTechnicalDetails ? (
                    <div className="rounded-xl border border-slate-800 bg-slate-950/70 p-4 text-left text-[11px] text-slate-400">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-slate-500">SHA-1 Full Hash</span>
                        <button
                          type="button"
                          onClick={handleCopyHash}
                          className="text-sky-400 hover:text-sky-300"
                        >
                          Salin lagi
                        </button>
                      </div>
                      <p className="mono-font mt-2 break-all rounded-lg border border-slate-800 bg-slate-900/90 p-2 text-slate-300">
                        {response.full_hash || "-"}
                      </p>
                    </div>
                  ) : null}
                </div>
              ) : (
                <div className="text-center text-xs text-slate-500 py-4">
                  Hasil analisis akan muncul di sini setelah password diperiksa.
                </div>
              )}
            </div>

            <div className="pt-1 text-center">
              <button
                type="button"
                onClick={() => setShowTechnicalDetails(!showTechnicalDetails)}
                className="text-[11px] text-slate-500 hover:text-slate-300 transition"
              >
                {showTechnicalDetails
                  ? "Sembunyikan detail teknis"
                  : "Lihat detail teknis"}
              </button>
            </div>

            {/* Footer */}
            <footer className="text-center text-[11px] text-slate-600 pt-4 border-t border-slate-900">
              SentinelPass &copy; 2026 — cek password yang sederhana, cepat, dan
              aman
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
